# PostgreSQL (Supabase). DB_URL debe usar el Session Pooler y sslmode=require;
# DB_USERNAME y DB_PASSWORD provienen exclusivamente de variables del entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
app.database.provider=postgresql
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# El esquema debe existir y ser compatible antes del arranque; no se crean
# ni modifican tablas automáticamente en producción.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false

# First controlled production connection: no startup reconciliation/bootstrap
# and no automatic membership lifecycle processing against the definitive data.
sistemagym.initial-admin.bootstrap.enabled=false
sistemagym.onboarding.enabled=false
sistemagym.onboarding.startup-check.enabled=false
sistemagym.membresias.scheduler.enabled=false

# TLS se termina en un proxy de confianza. No publicar el puerto de Spring
# directamente en Internet. Cookies seguras y URLs externas HTTPS.
app.auth.cookie-secure=true
server.port=${PORT:8080}
server.forward-headers-strategy=framework
sistemagym.frontend-url=${SISTEMAGYM_FRONTEND_URL}

# Render health check: expose only status, never internal component details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=false
app.actuator.health.public=true

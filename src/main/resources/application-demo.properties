# DEMO - Base de datos ficticia en memoria
spring.datasource.url=jdbc:h2:mem:sistemagym_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Crear las tablas al iniciar la demo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# No cargar datos de prueba automaticamente todavia
spring.sql.init.mode=never

# Puerto asignado por Render
server.port=${PORT:8080}

# Cookies seguras para HTTPS
app.auth.cookie-secure=true

spring.application.name=SistemaGym

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO

# Supply a Base64-encoded random key of at least 32 bytes through the deployment environment.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
# Access token lifetime: 15 minutes (900000 ms); override with JWT_EXPIRATION_MS.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Gmail SMTP; leave credentials unset until configured in the runtime environment.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SISTEMAGYM_MAIL_USERNAME:}
spring.mail.password=${SISTEMAGYM_MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
sistemagym.mail.from=${SISTEMAGYM_MAIL_FROM:}
sistemagym.frontend-url=${SISTEMAGYM_FRONTEND_URL:http://localhost:5173}
sistemagym.invitation.ttl-hours=${INVITATION_TTL_HOURS:48}
# Deliberately disabled until an operator enables it in the deployment environment.
sistemagym.membresias.scheduler.enabled=false
sistemagym.membresias.scheduler.cron=${MEMBRESIAS_SCHEDULER_CRON:0 0 0 * * *}
sistemagym.membresias.scheduler.zone=${MEMBRESIAS_SCHEDULER_ZONE:America/Lima}

# The test-only datasource sentinel deliberately has no driver. The MySQL
# Testcontainers safety initializer must replace it before Spring creates JPA.
spring.datasource.url=jdbc:fail-closed:e2e-datasource-must-come-from-testcontainers
spring.datasource.username=e2e-not-configured
spring.datasource.password=e2e-not-configured
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# No migration runner or bootstrap-created users in the infrastructure smoke test.
spring.flyway.enabled=false
spring.liquibase.enabled=false
sistemagym.initial-admin.bootstrap.enabled=false

# Bind only to loopback; the random port is assigned by @SpringBootTest.
server.address=127.0.0.1

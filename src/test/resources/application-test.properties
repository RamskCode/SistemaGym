# Configuración exclusiva del perfil de pruebas de integración de aplicación.
# La URL se fija también en SistemaGymApplicationTests como protección contra
# overrides externos que pudieran apuntar a una base MySQL real.
spring.datasource.url=jdbc:h2:mem:sistemagym-application-tests;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera y elimina el esquema solo en esta base H2 efímera.
# Producción conserva spring.jpa.hibernate.ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Ejecutar el fixture después de que Hibernate cree las tablas y antes de los
# ApplicationRunner, incluido el bootstrap del administrador.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/h2/sistemagym-application-test-data.sql

# Credenciales ficticias, exclusivas de la base H2 de pruebas.
INITIAL_ADMIN_NAME=Admin
INITIAL_ADMIN_LAST_NAME=Pruebas
INITIAL_ADMIN_EMAIL=admin@sistemagym.local
INITIAL_ADMIN_PASSWORD=TestAdmin2026!Local
